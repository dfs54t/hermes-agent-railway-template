[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/usr/local/bin/hermes-railway-entrypoint --model cognitivecomputations/dolphin-mistral-24b-venice-edition:free gateway run"
healthcheckPath = "/api/status"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
